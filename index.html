<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referral Links</title>
<meta name="description" content="Personal referral links and codes for apps I actually use.">
<style>
  :root {
    --bg: #fbfbfa;
    --surface: #ffffff;
    --text: #1a1a18;
    --muted: #6b6b66;
    --border: #e6e5e1;
    --accent: #2f6f4f;
    --chip: #f4f4f1;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --surface: #1c1c1a;
      --text: #f2f1ed;
      --muted: #9a9a93;
      --border: #2e2e2b;
      --accent: #7dc5a0;
      --chip: #262624;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --surface: #1c1c1a;
    --text: #f2f1ed;
    --muted: #9a9a93;
    --border: #2e2e2b;
    --accent: #7dc5a0;
    --chip: #262624;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 60rem;
    margin: 0 auto;
    padding: 56px 16px 80px;
  }

  /* ---------- header ---------- */

  header { margin-bottom: 2rem; }

  h1 {
    font-size: clamp(2rem, 7vw, 2.75rem);
    line-height: 1.1;
    letter-spacing: -0.03em;
    font-weight: 600;
    margin: 0;
  }

  .lede {
    color: var(--muted);
    margin: 0.625rem 0 0;
    max-width: 34rem;
  }

  .search-row {
    margin-top: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
  }

  #search {
    flex: 1 1 16rem;
    min-width: 0;
    font: inherit;
    font-size: 0.9375rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.625rem 0.875rem;
    box-shadow: var(--shadow);
  }

  #search::placeholder { color: var(--muted); }

  #search:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  #count {
    font-size: 0.8125rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- categories ---------- */

  .category { margin-top: 2.5rem; }

  .category h2 {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.875rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
    gap: 0.875rem;
  }

  /* ---------- card ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.125rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .card-head {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .logo {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 9px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 1.125rem;
    color: #fff;
    background: var(--accent);
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
  }

  /* Brand marks are icon-shaped, so inset them rather than filling the tile. */
  .logo img {
    width: 58%;
    height: 58%;
    object-fit: contain;
  }

  .card-title { min-width: 0; }

  .card-title .app {
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .card-title .tagline {
    font-size: 0.8125rem;
    color: var(--muted);
  }

  .reward {
    font-size: 0.9375rem;
    margin: 0;
  }

  .note {
    font-size: 0.8125rem;
    color: var(--muted);
    margin: 0;
  }

  /* Fixed two-row stack: row 1 is the link, row 2 is the code.
     Stretching both to full width means the copy feedback can never
     resize a button or reflow the rows. */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.5rem;
    margin-top: auto;
    padding-top: 0.25rem;
  }

  .btn, .code-chip {
    font: inherit;
    font-size: 0.875rem;
    border-radius: 9px;
    padding: 0.5rem 0.875rem;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }

  .btn {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 500;
    text-decoration: none;
    display: block;
    width: 100%;
    text-align: center;
  }

  .btn:hover { filter: brightness(1.08); }

  .code-chip {
    background: var(--chip);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.02em;
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    text-align: left;
  }

  /* Long codes ellipsize instead of widening the chip. */
  .code-chip .code {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .code-chip:hover { border-color: var(--accent); color: var(--accent); }

  /* min-width reserves room for the longest state ("Copied"), so the
     label swap never nudges the code beside it. */
  .code-chip .hint {
    flex: 0 0 auto;
    min-width: 3.25rem;
    font-family: inherit;
    font-size: 0.6875rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: right;
  }

  .code-chip.copied { border-color: var(--accent); }
  .code-chip.copied .hint { color: var(--accent); }

  .btn:focus-visible, .code-chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .pending {
    font-size: 0.8125rem;
    color: var(--muted);
    font-style: italic;
  }

  /* ---------- states ---------- */

  .banner {
    display: flex;
    gap: 0.625rem;
    align-items: flex-start;
    background: var(--chip);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 0.75rem 0.875rem;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    color: var(--muted);
  }

  .banner strong {
    color: var(--text);
    font-weight: 600;
  }

  .state {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
  }

  .state.error { color: #c0392b; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .state.error { color: #f08a7a; }
  }

  [hidden] { display: none !important; }

  /* ---------- footer ---------- */

  footer {
    margin-top: 3.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.875rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
  }

  footer a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
  }

  footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Referral Links</h1>
      <p class="lede">
        My personal referral links and codes for apps I actually use. Sign up through one
        and we both get something out of it.
      </p>

      <div class="search-row">
        <input id="search" type="search" placeholder="Search apps, categories&hellip;"
               aria-label="Search referrals" autocomplete="off" spellcheck="false">
        <span id="count" aria-live="polite"></span>
      </div>
    </header>

    <div id="banner" hidden></div>

    <main id="results" aria-live="polite">
      <p class="state" id="loading">Loading referrals&hellip;</p>
    </main>

    <footer>
      <span id="updated"></span>
      <a href="https://github.com/himanpatidar/referral">Source on GitHub</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
